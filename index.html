<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE BACKDOOR</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="auth-container" class="hidden">
        <div class="login-content">
            <h1 class="main-title" data-text="The Backdoor">The Backdoor</h1>
            <p class="subtitle">By Justin</p>
            <button class="discord-login-btn" onclick="location.href='/auth/login'">
                Login with Discord
            </button>
        </div>
        <div style="position: absolute; bottom: 30px; right: 40px; font-size: 12px; color: rgba(255, 255, 255, 0.4);">choigeonhwi0603@gmail.com</div>
    </div>

    <div id="main-container" class="hidden">
        <div class="sidebar">
            <div class="sidebar-header">
                <span>The Backdoor</span>
                <button class="create-btn" onclick="createGroupTunnel()">+</button>
            </div>
            <div id="channel-list"></div>
            <div class="user-footer">
                <div id="user-display">Connecting...</div>
            </div>
        </div>

        <div class="chat-container">
            <div class="chat-header">
                <span id="active-channel-name">Select a Channel</span>
            </div>
            <div id="chat-box"></div>
            
            <div class="input-area">
                <div class="input-wrapper">
                    <input type="text" id="msg-input" placeholder="type message" autocomplete="off">
                    <button id="send-btn" onclick="sendMessage()">
                        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
