<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE BACKDOOR</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="login-page" class="flex-center">
        <div class="login-container">
            <h1 class="main-logo">THE BACKDOOR</h1>
            <p class="author-tag">by Justin</p>
            <button class="discord-btn" onclick="location.href='/auth/login'">Login with Discord</button>
        </div>
        <div class="footer-contact">choigeonhwi0603@gmail.com</div>
    </div>

    <div id="main-app" style="display:none;">
        <nav id="sidebar">
            <div class="sidebar-header">CHANNELS</div>
            <ul id="channel-list"></ul>
            
            <div id="user-section">
                <div id="user-panel" onclick="toggleLogoutMenu(event)">
                    <img id="user-avatar" src="" alt="User">
                    <span id="user-name"></span>
                </div>
                <div id="logout-dropdown" class="dropdown-hidden">
                    <button onclick="location.href='/auth/logout'">Logout</button>
                </div>
            </div>
        </nav>

        <main id="chat-container">
            <header id="chat-header">Select a Channel</header>
            <div id="message-list"></div>
            
            <footer id="input-bar">
                <input type="file" id="image-input" accept="image/*" style="display:none;">
                <button id="upload-btn" onclick="document.getElementById('image-input').click()">📷</button>
                <input type="text" id="message-input" placeholder="Type a message...">
                <button id="send-btn">Send</button>
            </footer>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
